---
name: Release collection
on:
  workflow_call:
    inputs:
      collection_fqcn:
        required: true
        type: string
      downstream_name:
        required: false
        type: string
      release_summary:
        required: false
        type: string
    secrets:
      galaxy_token:
        required: true
      jira_webhook:
        required: false
      push_token:
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: write
      contents: write
      deployments: write
      packages: write
      pages: write
      pull-requests: write
    outputs:
      tag_version: ${{ steps.get_version.outputs.TAG_VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.push_token || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Get current version
        id: get_version
        run: echo "TAG_VERSION=$(grep version galaxy.yml | awk -F'"' '{ print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check_tag
        run: echo "TAG_EXISTS=$(git tag | grep ${{ steps.get_version.outputs.TAG_VERSION }})" >> "$GITHUB_OUTPUT"

      - name: Fail if tag exists
        if: ${{ steps.get_version.outputs.TAG_VERSION == steps.check_tag.outputs.TAG_EXISTS }}
        uses: actions/github-script@v9
        with:
          script: |
              core.setFailed('Release tag already exists')

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core antsibull
          sudo apt --fix-missing update
          sudo apt install -y sed hub

      - name: Build collection
        run: |
          ansible-galaxy collection build .

      - name: Create changelog PR
        uses: ansible-middleware/collection-docs-action@main
        with:
          collection_fqcn: ${{ inputs.collection_fqcn }}
          collection_repo: ${{ github.repository }}
          dependencies: false
          commit_changelog: true
          commit_ghpages: false
          changelog_release: true
          generate_docs: false
          release_summary: ${{ inputs.release_summary }}
          token: ${{ secrets.push_token || github.token }}
          bot_email: ansible-middleware-core@redhat.com
          bot_account: ansible-middleware-core
